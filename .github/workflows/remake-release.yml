name: Remake release

# Builds a signed release APK when a version tag (for example v1.0.0) is pushed
# and attaches it to the GitHub Release of that tag.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Missing repository secret for $v (see remake/README.md, Releases)"; exit 1; fi
          done
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Fetch Axmol
        run: remake/tools/fetch-axmol.sh
      - name: Install Android SDK parts
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.31.6"
      - name: Build signed release APK
        working-directory: remake/proj.android
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          ./gradlew assembleRelease --stacktrace \
            -PKEY_STORE_FILE="$RUNNER_TEMP/release.jks" \
            -PKEY_STORE_PASSWORD='${{ secrets.ANDROID_KEYSTORE_PASSWORD }}' \
            -PKEY_ALIAS='${{ secrets.ANDROID_KEY_ALIAS }}' \
            -PKEY_PASSWORD='${{ secrets.ANDROID_KEY_PASSWORD }}'
      - name: Verify signature and prepare asset
        run: |
          APK=$(ls remake/proj.android/app/build/outputs/apk/release/*.apk | head -1)
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          cp "$APK" "MiniMilitia-by-Kadiyafali-${GITHUB_REF_NAME}.apk"
          sha256sum "MiniMilitia-by-Kadiyafali-${GITHUB_REF_NAME}.apk" | tee SHA256.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "Mini Militia by Kadiyafali $GITHUB_REF_NAME" \
            --notes "SHA-256: $(cut -d' ' -f1 SHA256.txt)" \
            "MiniMilitia-by-Kadiyafali-${GITHUB_REF_NAME}.apk" SHA256.txt
